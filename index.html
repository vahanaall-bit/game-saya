<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap Target Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 14px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    #startBtn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      width: 100%;
    }

    #startBtn:active {
      transform: scale(0.98);
    }

    #message {
      min-height: 24px;
      margin: 8px 0 12px;
      color: #e2e8f0;
      font-size: 14px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 320px;
      max-height: 500px;
      background: #e2e8f0;
      border-radius: 18px;
      overflow: hidden;
      border: 4px solid #94a3b8;
    }

    #target {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: #ef4444;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
      display: none;
      touch-action: manipulation;
    }

    #target:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tap Target</h1>
    <p class="sub">Ketuk lingkaran merah sebanyak mungkin dalam 30 detik.</p>

    <div class="hud">
      <div>Skor: <span id="score">0</span></div>
      <div>Waktu: <span id="time">30</span>s</div>
    </div>

    <button id="startBtn">Mulai Game</button>
    <p id="message">Tekan tombol mulai untuk bermain.</p>

    <div id="gameArea">
      <button id="target" aria-label="Target"></button>
    </div>
  </div>

    const startBtn = document.getElementById("startBtn");
    const messageEl = document.getElementById("message");
    const gameArea = document.getElementById("gameArea");
    const target = document.getElementById("target");

    let targetSize = 72;
    let gameRunning = false;

      timeEl.textContent = timeLeft;
